name: Android APK

# Repo layout: android-port.zip (the port) and this file. The workflow downloads the upstream
# project, applies the port on top, builds the APK, and builds the Termux kit.
# Outputs: the3rdbirthday-unsigned.apk (zipaligned, NOT signed: sign it yourself) and
# termux-kit.zip. No game code is in either: it is built on your phone from your own disc.
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream commit or branch ('master' = newest). Blank = the tested commit."
        default: ""
      sdl_ref:
        description: "SDL3 branch or tag"
        default: "release-3.2.x"
  push:
    paths: ["android-port.zip", ".github/workflows/android.yml"]

env:
  UPSTREAM: BasedYuki/the-3rd-birthday-recomp
  TESTED: feb52d31f4f668003d80d0523c4e6de708a1b4d9

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: port }

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ github.event.inputs.upstream_ref || env.TESTED }}
          path: src

      - name: Apply the Android port
        run: |
          mkdir port-unzipped
          unzip -q port/android-port.zip -d port-unzipped
          cp -a port-unzipped/overlay/. src/
          cd src
          patch -p1 --no-backup-if-mismatch < ../port-unzipped/patches/upstream-edits.patch || {
            echo "::error::The port does not apply to this upstream version (see the lines above). Send them to the port's author."
            exit 1; }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - name: Android SDK pieces (the runner already has the SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Stage (fetch SDL3, copy data files, kit id)
        working-directory: src
        run: bash android/stage.sh "${{ github.event.inputs.sdl_ref || 'release-3.2.x' }}"

      - name: Native build (lists ALL compile errors at once)
        working-directory: src
        run: |
          set +e
          CMAKE="$ANDROID_HOME/cmake/3.22.1/bin/cmake"; NINJA="$ANDROID_HOME/cmake/3.22.1/bin/ninja"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          "$CMAKE" -S android/app/jni -B /tmp/nb -G Ninja -DCMAKE_MAKE_PROGRAM="$NINJA" \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=RelWithDebInfo > native.log 2>&1
          code=$?
          if [ $code -eq 0 ]; then "$NINJA" -C /tmp/nb -k 0 main >> native.log 2>&1; code=$?; fi
          if [ $code -ne 0 ]; then
            echo "================ ALL NATIVE ERRORS (copy from here) ================"
            grep -E "error:|undefined symbol|CMake Error|fatal error" -A3 native.log | head -250
            exit 1
          fi
          echo "native build OK"

      - name: Build APK
        working-directory: src
        run: |
          set +e
          gradle -p android assembleRelease --no-daemon --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "================ COMPILER / LINKER ERRORS (copy from here) ================"
            grep -nE "FAILED: |error: |fatal error|undefined symbol|undefined reference|CMake Error|What went wrong" -A4 build.log | head -150
            echo "================ last 40 lines ================"
            tail -40 build.log
          else
            tail -5 build.log
          fi
          exit $code

      - name: Keep the build log if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            src/build.log
            src/native.log
          if-no-files-found: ignore

      - name: Align (unsigned)
        working-directory: src
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          echo "built: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -p -f 4 "$APK" the3rdbirthday-unsigned.apk
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -c -p 4 the3rdbirthday-unsigned.apk && echo aligned

      - name: Termux kit
        working-directory: src
        run: bash android/make_kit.sh termux-kit.zip

      - uses: actions/upload-artifact@v4
        with:
          name: the3rdbirthday-android
          path: |
            src/the3rdbirthday-unsigned.apk
            src/termux-kit.zip
